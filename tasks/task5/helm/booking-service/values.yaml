appName: booking-service
version: v1

replicaCount: 1

image:
  name: booking-service
  tag: latest
  pullPolicy: Never

service:
  enabled: true
  type: ClusterIP
  port: 80
  targetPort: 8080

ENABLE_FEATURE_X: "false"

env:
  - name: DATABASE_URL
    value: postgresql+psycopg://booking:booking@booking-db:5432/booking
  - name: KAFKA_BOOTSTRAP_SERVERS
    value: kafka:9092
  - name: MONOLITH_URL
    value: http://hotelio-monolith:8080

resources:
  requests:
    cpu: 50m
    memory: 96Mi
  limits:
    cpu: 250m
    memory: 192Mi

livenessProbe:
  httpGet:
    path: /ping
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /ping
    port: http
  initialDelaySeconds: 2
  periodSeconds: 5
