version: '3.8'

services:
  apollo-gateway:
    build: ./apollo-gateway
    container_name: apollo-gateway
    ports:
      - "4000:4000"
    depends_on:
      - booking-subgraph
      - hotel-subgraph
      - promocode-subgraph
    restart: on-failure
    networks:
      - hotelio-net

  booking-subgraph:
    build: ./booking-subgraph
    container_name: booking-subgraph
    ports:
      - "4001:4001"
    environment:
      BOOKING_SERVICE_ADDR: booking-service:9090
    networks:
      - hotelio-net

  hotel-subgraph:
    build: ./hotel-subgraph
    container_name: hotel-subgraph
    ports:
      - "4002:4002"
    environment:
      MONOLITH_URL: http://hotelio-monolith:8080
    networks:
      - hotelio-net

  promocode-subgraph:
    build: ./promocode-subgraph
    container_name: promocode-subgraph
    ports:
      - "4003:4003"
    environment:
      MONOLITH_URL: http://hotelio-monolith:8080
    networks:
      - hotelio-net

networks:
  hotelio-net:
    external: true
