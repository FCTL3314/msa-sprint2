[project]
name = "booking-service"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "confluent-kafka>=2.6",
    "grpcio>=1.68",
    "grpcio-reflection>=1.68",
    "grpcio-tools>=1.68",
    "httpx>=0.28",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
pythonpath = ["."]
